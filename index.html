<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXELBOUNTY</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="media.css">
  </head>
  <body>
    <div id="tsparticles"></div>
    <!-- Header -->
    <header>
      <nav class="container">
        <a href="#" class="logo">PIXELBOUNTY</a>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#links">Links</a></li>
      </ul>
    </nav>
  </header>
  
  <!-- Hero Section -->
  <section id="home" class="hero">
    <div class="hero-content">
      <h1>Welcome to My Channel</h1>
      <img src="pixelbounty.png" alt="" height="200" style="border-radius: 50%;"> 
      <p>Creating amazing content for viewers like you</p>
      <a href="#links" class="cta-button">Check Out My Links</a>
        </div>
    </section>


    <!-- Links Section -->
    <section id="links" class="links-section">
      <div class="container">
        <h2>Connect With Me</h2>
        <p>Find me on these platforms and stay connected!</p>
        
        <div class="social-links">
          <a href="https://www.youtube.com/@PIXEL_BOUNTY" class="link-card" target="_blank">
            <div class="link-icon">📺</div>
            <h3>YouTube</h3>
            <p>Subscribe for amazing content</p>
          </a>
          
          <a href="https://mail.google.com/mail/?view=cm&fs=1&to=rajatsemwal17@gmail.com" class="link-card">
            <div class="link-icon">✉️</div>
            <h3>Email</h3>
            <p>Business inquiries</p>
          </a>
        </div>
      </div>
    </section>
    
    <!-- Footer -->
    <canvas id="confetti-canvas"></canvas>
    <footer>
        <div class="container">
            <p>&copy;PIXELBOUNTY . All rights reserved. <i class="fa-solid fa-circle-check" style="color: rgb(0, 255, 0);"></i></p>
        </div>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script>
const duration = 5 * 1000;
const end = Date.now() + duration;

(function frame() {
  confetti({
    particleCount: 3,
    angle: 60,
    spread: 55,
    origin: { x: 0 }
  });
  confetti({
    particleCount: 3,
    angle: 120,
    spread: 55,
    origin: { x: 1 }
  });
  if (Date.now() < end) {
    requestAnimationFrame(frame);
  }
})();

  document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Add scroll effect to header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 100) {
                header.style.background = 'rgba(0, 0, 0, 0.9)';
            } else {
                header.style.background = 'rgba(255, 255, 255, 0.1)';
            }
        });

        // Animate elements on scroll
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Observe all link cards for animation
        document.querySelectorAll('.link-card').forEach(card => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(30px)';
            card.style.transition = 'all 0.6s ease';
            observer.observe(card);
        });

        // Add hover sound effect (optional)
        document.querySelectorAll('.link-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-10px) scale(1.02)';
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0) scale(1)';
            });
        });
</script>




</body>
</html>
